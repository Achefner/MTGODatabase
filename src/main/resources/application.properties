quarkus.http.test-port=8090
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:mtgodb;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=mtgo
%prod.quarkus.datasource.password=mtgo
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mtgodb
%prod.quarkus.hibernate-orm.database.generation=update

%local.quarkus.datasource.db-kind=postgresql
%local.quarkus.datasource.username=mtgo
%local.quarkus.datasource.password=mtgo
%local.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mtgodb
%local.quarkus.hibernate-orm.database.generation=update

# CORS for front-end microservices running on another origin (e.g. MTGOEnchantWordle on vite's :5173)
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/.*/
%local.quarkus.http.cors.enabled=true
%local.quarkus.http.cors.origins=/.*/
